services:
  redis:
    image: docker.1ms.run/library/redis:7-alpine
    container_name: candoit-lark-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_lark_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend_lark:
    build:
      context: .
      dockerfile: Dockerfile.backend.lark
    container_name: candoit-lark-backend
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - PUBLIC_BASE_URL=http://localhost:8001
      # Optional: set this when Feishu event subscription verification token is enabled.
      # - FEISHU_VERIFICATION_TOKEN=your-verification-token
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./providers.yaml:/app/providers.yaml:ro
      - ./outputs:/app/outputs
      - ./backend/skills/packages:/app/backend/skills/packages
      - ./skills_packages.json:/app/skills_packages.json

volumes:
  redis_lark_data:
