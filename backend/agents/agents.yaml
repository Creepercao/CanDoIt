# Built-in sub-agent configurations.
# Each agent declares its worker (key in WORKER_MAP), dependencies,
# and display metadata.  Adding a new agent = adding an entry here +
# implementing its worker in builtin_workers.py.
#
# Skills (add-on capabilities) live separately in:
#   - backend/skills/*.py          (Python module skills)
#   - backend/skills/packages/*/   (SKILL.md package skills)

agents:
  - name: research
    display_name: Research
    description: "Web search + scrape for real information, data, and numbers"
    emoji: "🔍"
    worker: research
    depends_on: []
    result_key: research_results

  - name: analyst
    display_name: Analyst
    description: "Extract structured numerical data from research text"
    emoji: "📊"
    worker: analyst
    depends_on: [research]
    result_key: analyst_results

  - name: chart
    display_name: Chart Maker
    description: "Render analyst structured data as charts (bar/line/pie/scatter)"
    emoji: "📈"
    worker: chart
    depends_on: [analyst]
    result_key: chart_results

  - name: image_gen
    display_name: Image Generator
    description: "Creative/artistic images, illustrations, photos"
    emoji: "🎨"
    worker: image_gen
    depends_on: []
    prompt_contribution: "- image_gen: creative images, illustrations, photos"
    result_key: image_results

  - name: video_gen
    display_name: Video Generator
    description: "Videos and animations"
    emoji: "🎬"
    worker: video_gen
    depends_on: []
    prompt_contribution: "- video_gen: video, animation"
    result_key: video_results

  - name: code
    display_name: Programmer
    description: "Programming, scripts, HTML, application code"
    emoji: "💻"
    worker: code
    depends_on: []
    prompt_contribution: "- code: programming, scripts, app code"
    result_key: code_results

  - name: ppt_planner
    display_name: PPT Planner
    description: "Plan a slide deck outline from research results"
    emoji: "🧭"
    worker: ppt_planner
    depends_on: [research]
    prompt_contribution: "- ppt_planner: create a slide-by-slide outline for PPT/presentation requests after research"
    result_key: skill_outputs

  - name: ppt_slide
    display_name: PPT Slide Builder
    description: "Render one planned slide as an HTML slide section"
    emoji: "🧩"
    worker: ppt_slide
    depends_on: [ppt_planner]
    prompt_contribution: "- ppt_slide: generate individual HTML slide sections in parallel from ppt_planner output"
    result_key: skill_outputs

  - name: ppt_assembler
    display_name: PPT Assembler
    description: "Assemble generated slide sections into a complete animated HTML deck"
    emoji: "🎞️"
    worker: ppt_assembler
    depends_on: [ppt_slide]
    prompt_contribution: "- ppt_assembler: assemble ppt_slide outputs into one complete HTML presentation"
    result_key: skill_outputs
